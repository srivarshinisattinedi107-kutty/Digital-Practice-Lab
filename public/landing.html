<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Practice Lab</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column justify-content-between min-vh-100">

  <!-- Simple Brand Navigation Bar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
        <i class="bi bi-mortarboard-fill fs-4"></i>
        <span>Digital Practice Lab</span>
      </a>
    </div>
  </nav>

  <!-- Centered Hero Landing Section -->
  <main class="d-flex align-items-center justify-content-center text-center position-relative overflow-hidden my-auto py-5">
    
    <!-- Decorative Ambient Background Orbs -->
    <div style="position: absolute; top: -120px; left: -120px; width: 420px; height: 420px; background: rgba(99, 102, 241, 0.18); filter: blur(90px); border-radius: 50%; pointer-events: none;"></div>
    <div style="position: absolute; bottom: -120px; right: -120px; width: 450px; height: 450px; background: rgba(34, 211, 238, 0.22); filter: blur(100px); border-radius: 50%; pointer-events: none;"></div>

    <div class="container px-4" style="z-index: 2;">
      
      <!-- Accent Category Pill -->
      <span class="badge rounded-pill bg-white shadow-sm mb-4 px-3 py-2 fw-semibold" style="color: #6366F1; border: 1px solid rgba(99, 102, 241, 0.25);">
        Interactive Digital Training
      </span>

      <!-- Main Project Title -->
      <h1 class="display-1 fw-extrabold mb-3" style="color: #0F172A; letter-spacing: -0.03em;">
        Digital Practice Lab
      </h1>

      <!-- Suitable Subtitle Line -->
      <p class="lead mx-auto mb-5" style="max-width: 650px; color: #1E1B4B; font-size: 1.25rem; font-weight: 500;">
        Master essential digital services and online safety with confidence in a risk-free environment.
      </p>

      <!-- Redirect Button to main index/dashboard -->
      <a href="index.html" class="btn btn-primary btn-lg px-5 py-3 rounded-pill fs-5 d-inline-flex align-items-center gap-2">
        Get Started <i class="bi bi-arrow-right"></i>
      </a>

    </div>
  </main>

  <!-- Clean Footer -->
  <footer class="py-3 text-center">
    <div class="container">
      <small>© 2026 Digital Practice Lab. All rights reserved.</small>
    </div>
  </footer>
