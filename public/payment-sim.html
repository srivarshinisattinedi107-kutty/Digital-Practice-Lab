<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Simulator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Hide native Google Translate top banner & elements */
    #google_translate_element, .goog-te-banner-frame, .skiptranslate {
      display: none !important;
    }
    body { top: 0px !important; }
  </style>
</head>
<body>
  <!-- Hidden Google Translate Element -->
  <div id="google_translate_element"></div>

  <!-- Navigation Bar with Language Selection -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand fw-bold" href="dashboard.html">Digital Practice Lab</a>
      
      <div class="d-flex align-items-center gap-3">
        <!-- Language Selector -->
        <div class="d-flex align-items-center">
          <span class="text-white me-2 small">🌐 Language:</span>
          <select id="navLangSelect" class="form-select form-select-sm rounded-pill px-3 fw-bold"></select>
        </div>
        <a href="dashboard.html" class="btn btn-outline-light btn-sm rounded-pill">Back to Dashboard</a>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-lg p-4 border-0">
          <h3 class="mb-2 text-primary text-center fw-bold">💳 Payment Form Simulator</h3>
          <p class="text-muted text-center mb-4">Practice entering digital payment details safely</p>
          
          <form id="paymentForm">
            <div class="mb-3">
              <label class="form-label fw-bold">Recipient Name</label>
              <input type="text" id="payeeName" class="form-control" placeholder="e.g. Rahul Sharma" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Amount (₹)</label>
              <input type="number" id="payAmount" class="form-control" placeholder="0.00" min="1" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Payment Method</label>
              <select id="payMethod" class="form-select" required>
                <option value="UPI">UPI ID / QR Code</option>
                <option value="Debit Card">Debit / Credit Card</option>
                <option value="Net Banking">Net Banking</option>
              </select>
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold">Note / Purpose</label>
              <input type="text" id="payNote" class="form-control" placeholder="e.g. Grocery, Rent">
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold">Proceed to Pay</button>
          </form>

          <div id="paymentResult" class="mt-4 d-none"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/simulators.js"></script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
