<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATM Simulator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Hide native Google Translate top banner & elements */
    #google_translate_element, .goog-te-banner-frame, .skiptranslate {
      display: none !important;
    }
    body { top: 0px !important; }
  </style>
</head>
<body>
  <!-- Hidden Google Translate Element -->
  <div id="google_translate_element"></div>

  <!-- Navigation Bar with Language Selection -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand fw-bold" href="dashboard.html">Digital Practice Lab</a>
      
      <div class="d-flex align-items-center gap-3">
        <!-- Language Selector -->
        <div class="d-flex align-items-center">
          <span class="text-white me-2 small">🌐 Language:</span>
          <select id="navLangSelect" class="form-select form-select-sm rounded-pill px-3 fw-bold"></select>
        </div>
        <a href="dashboard.html" class="btn btn-outline-light btn-sm rounded-pill">Back to Dashboard</a>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-lg p-4 border-0">
          <h3 class="mb-2 text-primary text-center fw-bold">🏧 Interactive ATM Simulator</h3>
          <p class="text-muted text-center mb-4">Practice PIN entry, balance checks, deposits, and cash withdrawals</p>
          
          <!-- Step 1: PIN Entry -->
          <div id="pinStep">
            <div class="mb-3">
              <label class="form-label fw-bold">Enter 4-Digit ATM PIN</label>
              <input type="password" id="atmPinInput" class="form-control text-center fs-3" placeholder="••••" maxlength="4" required>
            </div>
            <button id="verifyPinBtn" class="btn btn-primary w-100 py-2 rounded-pill fw-bold">Verify PIN</button>
          </div>

          <!-- Step 2: ATM Main Menu -->
          <div id="atmMenu" class="d-none">
            <h5 class="fw-bold text-center text-secondary mb-3">Select Action</h5>
            <div class="d-grid gap-3">
              <button id="checkBalanceBtn" class="btn btn-outline-primary py-2 text-start fw-bold">1. Check Account Balance</button>
              <button id="depositCashBtn" class="btn btn-outline-success py-2 text-start fw-bold">2. Cash Deposit</button>
              <button id="withdrawCashBtn" class="btn btn-outline-warning py-2 text-start fw-bold">3. Cash Withdrawal</button>
            </div>

            <!-- Cash Deposit Area -->
            <div id="depositFormArea" class="mt-4 d-none">
              <label class="form-label fw-bold">Enter Cash Deposit Amount (₹)</label>
              <input type="number" id="depositAmount" class="form-control mb-3" placeholder="e.g. 500, 2000" min="100" step="100">
              <button id="confirmDepositBtn" class="btn btn-success w-100 rounded-pill">Confirm Deposit</button>
            </div>

            <!-- Cash Withdrawal Area -->
            <div id="withdrawFormArea" class="mt-4 d-none">
              <label class="form-label fw-bold">Enter Cash Withdrawal Amount (₹)</label>
              <input type="number" id="withdrawAmount" class="form-control mb-3" placeholder="e.g. 500, 1000" min="100" step="100">
              <button id="confirmWithdrawBtn" class="btn btn-warning w-100 rounded-pill fw-bold">Confirm Withdrawal</button>
            </div>

            <div id="atmFeedback" class="mt-4 d-none"></div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/simulators.js"></script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
